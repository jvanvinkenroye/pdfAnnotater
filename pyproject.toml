[project]
name = "pdf-annotator"
version = "0.2.0"
description = "Flask-based PDF annotation tool with side-by-side view"
authors = [{ name = "Jan Vanvinkenroye", email = "jan@vanvinkenroye.de" }]
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0.0",
  "pymupdf>=1.23.0",
  "pillow>=10.0.0",
  "flaskwebgui>=1.1.8",
  "flask-wtf>=1.2.2",
  "flask-limiter>=4.1.1",
  "flask-login>=0.6.3",
  "playwright>=1.58.0",
  "gunicorn>=23.0.0",
  "anthropic>=0.117.0",
  "openai>=2.46.0",
  "python-dotenv>=1.2.2",
  "swb",
  "ocrmypdf>=17.10.0",
]

[project.scripts]
pdf-annotator = "pdf_annotator.desktop:main"
pdf-annotator-server = "pdf_annotator.app:run_server"
pdf-annotator-toga = "pdf_annotator.desktop_toga:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.1.0",
  "pytest>=7.4.0",
  "pytest-flask>=1.3.0",
  "mypy>=1.7.0",
  "types-flask",
]
toga = [
    "toga>=0.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff config in ruff.toml

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:importlib._bootstrap",
  "ignore::DeprecationWarning:sqlite3",
]

[tool.uv.sources]
swb = { git = "https://github.com/jvanvinkenroye/swb.git" }

[dependency-groups]
dev = ["mkdocs>=1.6.1", "mkdocs-material>=9.7.3", "pytest-cov>=7.0.0"]

# ── Briefcase (Toga desktop packaging, experimental) ─────────────────────────
[tool.briefcase]
project_name = "PDF Annotator"
bundle = "de.vanvinkenroye"
version = "0.3.0"
license.file = "LICENSE"

[tool.briefcase.app.pdf-annotator]
formal_name = "PDF Annotator"
description = "PDF annotation tool with side-by-side view for notes"
sources = ["src/pdf_annotator"]
icon = "src/pdf_annotator/resources/pdfannotator"
# Desktop shell doesn't need flaskwebgui/playwright/gunicorn — keeping the
# bundle small. ocrmypdf is also excluded: OCR needs system tesseract
# (not bundled, so the OCR button stays hidden in the .app anyway) and
# its pikepdf>=10 dependency has no wheels for the briefcase support
# package's Python.
requires = [
  "flask>=3.0.0",
  "pymupdf>=1.23.0",
  "pillow>=10.0.0",
  "flask-wtf>=1.2.2",
  "flask-limiter>=4.1.1",
  "flask-login>=0.6.3",
  "anthropic>=0.117.0",
  "openai>=2.46.0",
  "python-dotenv>=1.2.2",
  "swb @ git+https://github.com/jvanvinkenroye/swb.git",
]

[tool.briefcase.app.pdf-annotator.macOS]
universal_build = false
# pikepdf (via ocrmypdf) only ships macosx_14_0 wheels for cp312 — the
# default macOS 11 deployment target would make pip unable to find them
min_os_version = "14.0"
requires = [
  "toga-cocoa>=0.4.5",
  "std-nslog>=1.0.3",
]
